[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-sam-photoshop-backend"
version = "0.9.1"
description = "Offline SAM 3.1 inference service for FR SAM Text Selection"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inference = [
  "torch==2.10.0+cu128",
  "torchvision==0.25.0+cu128",
  "numpy==1.26.4",
  "Pillow==9.5.0",
  "safetensors==0.4.5",
  "timm==1.0.22",
  "ftfy==6.1.1",
  "regex==2023.8.8",
  "iopath==0.1.9",
  "typing_extensions==4.15.0",
  "huggingface_hub==0.34.4",
  "setuptools==60.2.0",
  "einops==0.8.0",
  "triton-windows==3.6.0.post26; platform_system == 'Windows'",
  "pycocotools==2.0.11",
  "psutil==5.9.5"
]

[tool.setuptools.packages.find]
include = ["sam31_backend*"]
